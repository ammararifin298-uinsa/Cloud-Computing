<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Logistik</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#1f2937}
  h1{font-size:1.4rem}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .card{flex:1;min-width:140px;padding:12px;border:1px solid #e5e7eb;border-radius:8px}
  .card b{display:block;font-size:1.5rem}
  form{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  input,select,button{padding:8px;border:1px solid #d1d5db;border-radius:6px}
  button{background:#2563eb;color:#fff;border:0;cursor:pointer}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px;border-bottom:1px solid #e5e7eb;font-size:.9rem}
  #msg{font-size:.9rem;min-height:1.2em}
</style>
</head>
<body>
<h1>Dashboard Logistik &amp; Rantai Pasok</h1>
<div class="cards" id="cards"></div>

<form id="f">
  <input name="shipment_code" placeholder="Kode barang (mis. SHP-001)" required>
  <select name="status">
    <option>DITERIMA</option><option>DISIMPAN</option>
    <option>DALAM_PERJALANAN</option><option>DIKIRIM</option><option>SELESAI</option>
  </select>
  <input name="location" placeholder="Lokasi (mis. Gudang A)" required>
  <button>Kirim Event</button>
</form>
<div id="msg"></div>

<h3>10 Event Terbaru</h3>
<table>
  <thead><tr><th>Kode</th><th>Status</th><th>Lokasi</th><th>Waktu</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
async function load(){
  try{
    const d = await (await fetch('/api/dashboard')).json();
    document.getElementById('cards').innerHTML =
      `<div class="card">Total Event<b>${d.total_events}</b></div>
       <div class="card">Event 1 Jam Terakhir<b>${d.events_last_hour}</b></div>` +
      d.by_status.map(s=>`<div class="card">${s.status}<b>${s.total}</b></div>`).join('');
    document.getElementById('rows').innerHTML = d.latest.map(e=>
      `<tr><td>${e.shipment_code}</td><td>${e.status}</td><td>${e.location}</td>
       <td>${new Date(e.recorded_at).toLocaleString('id-ID')}</td></tr>`).join('');
    document.getElementById('msg').textContent = '';
  }catch(err){
    document.getElementById('msg').textContent = 'Database tidak dapat dijangkau';
  }
}
document.getElementById('f').addEventListener('submit', async ev=>{
  ev.preventDefault();
  const body = Object.fromEntries(new FormData(ev.target));
  const r = await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  document.getElementById('msg').textContent = r.ok ? 'Event tersimpan' : 'Gagal menyimpan (' + r.status + ')';
  if(r.ok) load();
});
load(); setInterval(load, 5000);
</script>
</body>
</html>
