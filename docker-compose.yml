services:
  db:
    image: postgres:16-alpine
    container_name: warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: logistik
      POSTGRES_PASSWORD: logistik
      POSTGRES_DB: logistik
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistik"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    container_name: logistik-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://logistik:logistik@db:5432/logistik
      BACKUP_DIR: /backups
      BACKUP_INTERVAL: 900
    volumes:
      - ./backups:/backups:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    image: postgres:16-alpine
    container_name: logistik-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: logistik
      BACKUP_INTERVAL: 900
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'logistik_*.dump' -mmin -30 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 90s

volumes:
  pgdata: