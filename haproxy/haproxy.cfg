global
    maxconn 2000
    log stdout format raw local0 info

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    retries 3
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout check 2s

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s
    hold obsolete 5s

frontend pg_read_front
    bind *:5432
    default_backend pg_read_replicas

backend pg_read_replicas
    mode tcp
    balance leastconn
    option tcp-check
    # Active TCP healthcheck + dynamic discovery for 1..30 db-replica containers
    server-template replica 1-30 db-replica:5432 check inter 3s fall 2 rise 2 resolvers docker init-addr none
    # Automatic fallback to db-primary if all read replicas are down
    server primary_fallback db-primary:5432 check inter 5s backup resolvers docker init-addr none
