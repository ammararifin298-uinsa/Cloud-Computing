worker_processes auto;
events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver      127.0.0.11 valid=5s ipv6=off;

    log_format json_analytics escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"cache_status":"$upstream_cache_status"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  55s;
    client_max_body_size 10m;
    client_header_timeout 10s;
    client_body_timeout   15s;

    # Rate Limiting & Connection Limiting per IP (DDoS / Brute-Force Protection)
    limit_req_zone  $binary_remote_addr zone=auth_limit:10m   rate=30r/m;
    limit_req_zone  $binary_remote_addr zone=upload_limit:10m rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=api_limit:10m    rate=300r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Micro-cache for high-read public GET endpoints (shields DB from cache stampede)
    proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_microcache:10m
                     max_size=100m inactive=5m use_temp_path=off;

    server {
        listen 80;
        server_tokens off;

        # Use dynamic variables so Docker DNS resolves 1..10 scaled containers via least-loaded round-robin
        set $tracking_upstream tracking-service:8000;
        set $auth_upstream     auth-service:8000;
        set $media_upstream    media-service:8000;
        set $cdn_upstream      cdn:80;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

        # Custom JSON 429 response
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 10 always;
            return 429 '{"detail":"Terlalu banyak permintaan dari IP Anda. Silakan tunggu beberapa detik."}';
        }

        # 1. Auth Microservice (strict rate limit on login/register/forgot-password)
        location ~ ^/api/auth/(login|register|forgot-password)$ {
            limit_req zone=auth_limit burst=20 nodelay;
            limit_conn addr_conn 50;
            proxy_pass http://$auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
            proxy_next_upstream error timeout http_502 http_504;
        }

        location ~ ^/api/(auth|users|settings|backups|couriers/applications) {
            limit_req zone=api_limit burst=150 nodelay;
            proxy_pass http://$auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
            proxy_next_upstream error timeout http_502 http_504;
        }

        # 2. Media Microservice (uploads -> MinIO object storage)
        location ~ ^/api/uploads {
            limit_req zone=upload_limit burst=30 nodelay;
            client_max_body_size 6m;
            proxy_pass http://$media_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_504;
        }

        # 3. Tracking Microservice — Micro-cached Public Reference Data (60s)
        location = /api/reference {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_cache api_microcache;
            proxy_cache_valid 200 60s;
            proxy_cache_lock on;
            add_header X-API-Cache $upstream_cache_status always;
            proxy_pass http://$tracking_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
        }

        # 4. Tracking Microservice — All other tracking, order, dashboard, and health APIs
        location /api/ {
            limit_req zone=api_limit burst=250 nodelay;
            proxy_pass http://$tracking_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 25s;
            proxy_next_upstream error timeout http_502 http_504;
        }

        location ~ ^/(health|livez|readyz|metrics)$ {
            proxy_pass http://$tracking_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        # 5. Everything else (React SPA static bundle & /uploads/* media cache) -> Edge CDN
        location / {
            proxy_pass http://$cdn_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
    }
}
