worker_processes auto;
events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver      127.0.0.11 valid=5s ipv6=off;
    access_log    off;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    gzip              on;
    gzip_min_length   256;
    gzip_comp_level   4;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Real Edge CDN Disk + Memory Proxy Cache fronting MinIO Object Storage
    proxy_cache_path /var/cache/nginx/media_cache levels=1:2 keys_zone=media_edge_cache:20m
                     max_size=500m inactive=60m use_temp_path=off;

    server {
        listen 80;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Served-By "lacakin-cdn" always;

        location = /cdn-health {
            default_type application/json;
            return 200 '{"status":"ok","node":"lacakin-cdn","cache":"nginx-proxy-cache"}';
        }

        # Real proxy_cache to MinIO Object Storage (X-Cache-Status: MISS -> HIT)
        location ^~ /uploads/ {
            set $minio_origin minio:9000;
            rewrite ^/uploads/(.*)$ /lacakin-media/$1 break;

            proxy_cache media_edge_cache;
            proxy_cache_key "$uri";
            proxy_cache_valid 200 30m;
            proxy_cache_valid 404 10s;
            proxy_cache_lock on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_ignore_headers Set-Cookie;

            proxy_pass http://$minio_origin;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;

            add_header Cache-Control "public, max-age=1800" always;
            add_header X-Served-By "lacakin-cdn" always;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-CDN-Cache $upstream_cache_status always;
        }

        # Vite fingerprinted production assets (/assets/*) — cached immutable
        location ^~ /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Served-By "lacakin-cdn" always;
            add_header X-Cache-Status "HIT" always;
            add_header X-CDN-Cache "HIT-EDGE-STATIC" always;
        }

        # Legacy /static/ alias compatibility for k6 benchmark comparison
        location ^~ /static/ {
            alias /usr/share/nginx/html/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Served-By "lacakin-cdn" always;
            add_header X-Cache-Status "HIT" always;
            add_header X-CDN-Cache "HIT-EDGE-STATIC" always;
        }

        # React SPA router fallback (/, /lacak, /tarif, /kirim, /checkpoint, /pengiriman, /pegawai, /backup, /profil, /login, /register)
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Served-By "lacakin-cdn" always;
            add_header X-Cache-Status "HIT" always;
        }
    }
}
