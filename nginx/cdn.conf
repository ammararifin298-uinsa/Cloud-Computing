worker_processes auto;
events { worker_connections 8192; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    resolver      127.0.0.11 valid=5s ipv6=off;
    access_log    off;
    client_max_body_size 25m;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    gzip              on;
    gzip_min_length   256;
    gzip_comp_level   4;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        root /usr/share/nginx/html;

        location = /cdn-health {
            default_type application/json;
            return 200 '{"status":"ok","node":"lacakin-cdn"}';
        }

        location /static/ {
            alias /usr/share/nginx/html/;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Served-By "lacakin-cdn" always;
            add_header X-CDN-Cache "HIT-EDGE-STATIC" always;
        }

        location /uploads/ {
            alias /usr/share/nginx/uploads/;
            expires 30m;
            add_header Cache-Control "public, max-age=1800" always;
            add_header X-Served-By "lacakin-cdn" always;
            add_header X-CDN-Cache "HIT-EDGE-STORAGE" always;
        }

        location = /           { try_files /index.html =404; add_header X-Served-By "lacakin-cdn" always; add_header X-CDN-Cache "HIT-EDGE-HTML" always; }
        location = /checkpoint { try_files /checkpoint.html =404; add_header X-Served-By "lacakin-cdn" always; add_header X-CDN-Cache "HIT-EDGE-HTML" always; }
        location = /pengiriman { try_files /pengiriman.html =404; add_header X-Served-By "lacakin-cdn" always; add_header X-CDN-Cache "HIT-EDGE-HTML" always; }
        location = /lacak      { try_files /lacak.html =404; add_header X-Served-By "lacakin-cdn" always; add_header X-CDN-Cache "HIT-EDGE-HTML" always; }
        location = /pegawai    { try_files /pegawai.html =404; add_header X-Served-By "lacakin-cdn" always; add_header X-CDN-Cache "HIT-EDGE-HTML" always; }
        location = /profil     { try_files /profil.html =404; add_header X-Served-By "lacakin-cdn" always; add_header X-CDN-Cache "HIT-EDGE-HTML" always; }
        location = /backup     { try_files /backup.html =404; add_header X-Served-By "lacakin-cdn" always; add_header X-CDN-Cache "HIT-EDGE-HTML" always; }
        location = /login      { try_files /login.html =404; add_header X-Served-By "lacakin-cdn" always; add_header X-CDN-Cache "HIT-EDGE-HTML" always; }
        location = /register   { try_files /register.html =404; add_header X-Served-By "lacakin-cdn" always; add_header X-CDN-Cache "HIT-EDGE-HTML" always; }
    }
}
